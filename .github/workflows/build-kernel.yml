name: Kernel Autobuild

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      # Targets the validated LineageOS kernel tree for the phone
      KERNEL_GIT_URL: https://github.com
      KERNEL_BRANCH: lineage-21
      KERNEL_DIR: ${{ github.workspace }}/kernel
      # Targets the uniform base system platform configuration
      DEFCONFIG: kona_defconfig
      ARCH: arm64
      SUBARCH: arm64
      OUT_DIR: ${{ github.workspace }}/out
      JOBS: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential git wget curl ca-certificates bc bison flex \
            python3 python3-pip python3-setuptools zip unzip ccache ncurses-dev \
            libssl-dev libelf-dev clang lld gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu binutils-aarch64-linux-gnu rsync

      - name: Fetch kernel source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$KERNEL_DIR"
          git clone --depth 1 --branch "$KERNEL_BRANCH" "$KERNEL_GIT_URL" "$KERNEL_DIR"

      - name: Download Standard AOSP Clang Toolchain
        shell: bash
        run: |
          mkdir -p ${{ github.workspace }}/clang
          # Pulls down verified stable r450784e compiler binaries for 4.19 layouts
          curl -LO https://googlesource.com
          tar -xzf clang-r450784e.tar.gz -C ${{ github.workspace }}/clang
          rm clang-r450784e.tar.gz

      - name: Fix Legacy Python Scripts
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          # Convert legacy print statements to Python 3 syntax across all script targets
          if [ -f scripts/gcc-wrapper.py ]; then
            sed -i "s/print \\([^,]*\\),/print(\\1,end=' ')/g" scripts/gcc-wrapper.py || true
            sed -i 's/print \(.*\)/print(\1)/g' scripts/gcc-wrapper.py || true
          fi

      - name: Build kernel
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$OUT_DIR"
          
          # Initialize path mapping targeting the explicit Clang binaries
          export PATH="${{ github.workspace }}/clang/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          cd "$KERNEL_DIR"
          # Trigger configuration targets using the explicit output tree environment
          make O="$OUT_DIR" ARCH=arm64 "$DEFCONFIG"
          
          # Compile using complete LLVM variables to handle assembly and linking cleanly
          make O="$OUT_DIR" -j"$JOBS" ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-w"

      - name: Package AnyKernel3 Zip Artifact
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/README.md || true
          
          # Locates and moves the compiled binary payload target cleanly
          if [ -f "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" AnyKernel3/
          else
            cp "$OUT_DIR/arch/arm64/boot/Image" AnyKernel3/
          fi
          
          cd AnyKernel3
          zip -r9 ../OnePlus9R-Kernel-Finished.zip .

      - name: Upload Finished Flashable Kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus9R-Kernel-Finished
          path: OnePlus9R-Kernel-Finished.zip
